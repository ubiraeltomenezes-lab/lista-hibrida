<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondialle Pro - Gestão Inteligente</title>
    <link rel="stylesheet" href="lista.css".css">
</head>

<body>


    <div class="topo-fixo">
        <div id="app-header">CARREGANDO...</div>
        <div id="contador-status">
            <span>Faltam: <b id="num-pendentes">0</b></span>
            <span>Total: <b id="valor-pendentes">R$ 0,00</b></span>
        </div>
        <div class="filtros-status">
            <button class="btn-f ativo-filtro" onclick="filtrarStatus('todos', this)">Todos</button>
            <button class="btn-f" onclick="filtrarStatus('falta', this)"
                style="color:var(--secondary)">Faltando</button>
            <button class="btn-f" onclick="filtrarStatus('ok', this)" style="color:var(--green)">OK</button>
        </div>
        <div class="menu-semana" id="botoes-semana">
            <button class="btn-dia ativo" id="btn-seg" onclick="mudarDia('SEG', this)">Seg</button>
            <button class="btn-dia" onclick="mudarDia('TER', this)">Ter</button>
            <button class="btn-dia" onclick="mudarDia('QUA', this)">Qua</button>
            <button class="btn-dia" onclick="mudarDia('QUI', this)">Qui</button>
            <button class="btn-dia" onclick="mudarDia('SEX', this)">Sex</button>
            <button class="btn-dia" onclick="mudarDia('SAB', this)">Sab</button>
            <button class="btn-dia" onclick="mudarDia('DOM', this)">Dom</button>
            <button class="btn-dia btn-total" onclick="mostrarRelatorio(this)">TOTAL</button>
        </div>
        <div class="busca-container" id="box-busca">
            <input type="text" id="campo-busca" placeholder="🔍 Buscar item..." onkeyup="filtrarItens()">
        </div>
    </div>

    <div class="container">
        <div id="lista-corpo"></div>
        <div id="painel-total">
            <div id="relatorio-financeiro"></div>
            <div id="relatorio-itens"></div>
            <div class="total-geral-final">FECHAMENTO:<br>R$ <span id="soma-semana">0,00</span></div>
            <button onclick="finalizarSemana()"
                style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Limpar
                Dados da Lista</button>
        </div>
    </div>

    <div class="fab-container">
        <div class="fab-menu" id="fabMenu">
            <button class="fab-item" onclick="trocarApp('CASA')">🏠 Compras Casa</button>
            <button class="fab-item" onclick="trocarApp('BEBIDAS')">🍺 Lista Bebidas</button>
            <button class="fab-item" onclick="trocarApp('PIZZARIA')">🍕 Pizzaria Mondialle</button>
        </div>
        <button class="fab-main" onclick="document.getElementById('fabMenu').classList.toggle('show')">🔄</button>
    </div>
    <button onclick="adicionarNovoItem()" style="background: var(--green); color: white; border: none; padding: 10px; border-radius: 5px; margin-bottom: 10px; cursor: pointer;">
    + Adicionar Novo Item
</button>

    <script src="lista.js"></script>
</body>

</html>
